<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خزانة الأفكار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f4f1;--card:#fff;--tx:#12201c;--mu:#5d6b66;--bd:#d9dfda;--ac:#0f5c4d;--ac2:#e0eee9;--sw:#2f5fd0;--hw:#c58a00;--bt:#0f5c4d;--ok:#1b7f3b;--wn:#b36b00;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#17211e;--tx:#e6ede9;--mu:#8fa098;--bd:#2a3833;--ac:#4cc4a8;--ac2:#1b2e29;--sw:#7ea2ff;--hw:#e8b43a;--bt:#4cc4a8;--ok:#5fd183;--wn:#e8b43a;--er:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;line-height:1.7}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{font-size:19px;margin:0;font-weight:700}h2{font-size:17px;margin:14px 0 6px}
main{max-width:1000px;margin:0 auto;padding:16px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:var(--card);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.g{background:var(--ac2);color:var(--ac)}.btn.d{background:none;color:var(--er);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.bar input{flex:1;min-width:140px}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-inline-start:6px solid var(--bt);border-radius:8px;padding:12px 14px;cursor:pointer}
.card.software{border-inline-start-color:var(--sw)}.card.hardware{border-inline-start-color:var(--hw)}
.card:hover{border-color:var(--ac)}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:6px 0 0;color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-inline-end:4px}
.tag.ok{color:var(--ok)}.tag.wn{color:var(--wn)}.tag.er{color:var(--er)}
.warn{background:var(--ac2);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:50px 10px}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:45vh;margin:10px 0}
.m{padding:9px 13px;border-radius:10px;max-width:90%;white-space:pre-wrap}
.m.user{background:var(--ac);color:var(--card);align-self:flex-start}
.m.assistant{background:var(--card);border:1px solid var(--bd);align-self:flex-end}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(700px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:#0009}
ul,ol{padding-inline-start:20px;margin:4px 0}
.step{display:flex;gap:8px;align-items:flex-start;margin:6px 0}.step input{width:auto;margin-top:6px}
.step.done span{text-decoration:line-through;color:var(--mu)}
#toast{position:fixed;bottom:16px;inset-inline:16px;margin:auto;max-width:420px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:8px;text-align:center;display:none;z-index:20}
</style>
</head>
<body>
<header>
  <h1>🗄️ خزانة الأفكار</h1>
  <div><button class="btn" onclick="newIdea()">＋ فكرة جديدة</button> <button class="btn g" onclick="openSettings()" aria-label="الإعدادات">⚙️</button></div>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<dialog id="set"></dialog>
<div id="toast"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
