<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sharara</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
</head>
<body>
<header>
  <h1 class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>Sharara</span></h1>
  <div class="header-right">
    <button type="button" id="sync-pill" class="sync-pill" onclick="openSettings()" aria-label="حالة المزامنة">⚪ محلي</button>
    <div class="header-actions">
      <button type="button" class="btn" data-view="new" onclick="newIdea()">＋ فكرة جديدة</button>
      <button type="button" class="btn g" data-view="focus">🎯 التركيز</button>
      <button type="button" class="btn g" data-view="quick" onclick="openQuickCapture()">⚡ فكرة سريعة</button>
      <button type="button" class="btn g" data-view="settings" onclick="openSettings()" aria-label="الإعدادات">⚙️</button>
    </div>
  </div>
</header>
<main id="app"></main>
<button class="fab" onclick="openQuickCapture()" aria-label="فكرة سريعة">⚡ فكرة سريعة</button>
<nav class="bottom-nav" aria-label="التنقل الرئيسي">
  <button type="button" data-nav="home" data-view="home" class="active" onclick="home()"><span>🚀</span><span>Sharara</span></button>
  <button type="button" data-nav="focus" data-view="focus"><span>🎯</span><span>التركيز</span></button>
  <button type="button" data-nav="new" data-view="new" onclick="newIdea()"><span>＋</span><span>نقاش</span></button>
  <button type="button" data-nav="quick" data-view="quick" onclick="openQuickCapture()"><span>⚡</span><span>سريعة</span></button>
  <button type="button" data-nav="settings" data-view="settings" onclick="openSettings()"><span>⚙️</span><span>الإعدادات</span></button>
</nav>
<dialog id="dlg"></dialog>
<dialog id="set"></dialog>
<dialog id="quick"></dialog>
<dialog id="focus-dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
